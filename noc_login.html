<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOC Copilot &mdash; Login</title>
  <meta name="description" content="Air-Gapped NOC Copilot login." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text-1: #ffffff;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --border-glass: rgba(255, 255, 255, 0.16);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --red-bd: rgba(239, 68, 68, 0.35);
      --mono: "SF Mono", ui-monospace, "Cascadia Code", "Fira Mono", "Consolas", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      background: #000000;
      color: var(--text-1);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }

    /* ── Satellite photo background ─────────────────────────────── */
    .bg-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('/static/bg.jpg') center/cover no-repeat;
    }
    .bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }

    /* ── Upper-left layout ───────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 50px 0 0 60px;
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px;
        align-items: center;
      }
    }

    /* ── Transparent Glassmorphism Card ─────────────────────────── */
    .card {
      width: 100%;
      max-width: 370px;
      background: rgba(15, 20, 28, 0.42);
      backdrop-filter: blur(25px) saturate(150%);
      -webkit-backdrop-filter: blur(25px) saturate(150%);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 34px 30px 28px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
      animation: fadeIn .4s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .card-header {
      margin-bottom: 24px;
    }

    .card-header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header p {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 4px;
      font-family: var(--mono);
      letter-spacing: 0.3px;
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px 11px 38px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 13px;
      font-family: var(--sans);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .toggle-pw:hover {
      color: #ffffff;
    }

    /* ── Error state ─────────────────────────────────────────────── */
    #errorMsg {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--red-bg);
      border: 1px solid var(--red-bd);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fca5a5;
      font-size: 12px;
      margin-bottom: 16px;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* ── Submit button (Clean Frosted Glass) ──────────────────────── */
    .btn-login {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 10px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.4px;
      font-family: var(--sans);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.26);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* ── Footer note ─────────────────────────────────────────────── */
    .card-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 10px;
      color: var(--text-3);
      font-family: var(--mono);
      line-height: 1.6;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
    }

    .cred-hint {
      margin-top: 6px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .cred-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <div class="bg-photo"></div>

  <div class="page">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <h1>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          NOC COPILOT
        </h1>
        <p>Air-Gapped Telemetry Access</p>
      </div>

      <!-- Error message slot (populated server-side on bad login) -->
      <div id="errorMsg" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        __ERROR__
      </div>

      <!-- Login form -->
      <form id="loginForm" method="POST" action="/login" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Enter any username" autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter any password" autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/hide password" id="toggleBtn">
              <svg id="eyeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>
      </form>

      <div class="card-footer">
        Quick Access Mode
        <div class="cred-hint">
          <span class="cred-pill">Enter anything or click Sign In directly</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eyeIcon');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      ico.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    function handleSubmit(e) {
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<div style="width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite"></div> Verifying&hellip;';
      btn.disabled = true;
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('username').focus();
    });
  </script>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
